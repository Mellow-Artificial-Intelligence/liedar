name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The published package runs on Node, so build it and run it on the oldest supported version.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - run: bun run build
      - run: npm run smoke:node
